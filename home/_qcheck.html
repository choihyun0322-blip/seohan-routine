<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>queue-check</title>
</head>
<body>
<div id="out" style="font:16px/1.6 -apple-system,sans-serif;padding:16px">running…</div>
<script>
/* 임시 점검 페이지 — 앱이 쌓아둔 가계부 전송 대기열(localStorage)을
   가짜 응답으로 비우고 결과만 보여준다. 끝나면 파일을 지운다. */
var hits = 0, bodies = [];
var orig = window.fetch.bind(window);
window.fetch = function (u, o) {
  var s = String(u && u.url ? u.url : u);
  if (s.indexOf('/rooms/choi-wallet-2026/inbox.json') >= 0) {
    hits++; bodies.push((o && o.body) || '');
    return Promise.resolve(new Response('{"name":"-qcheck"}', { status: 200 }));
  }
  return orig(u, o);
};
(function () {
  var src = document.createElement('script');
  src.src = 'app.js?qcheck=' + Date.now();
  src.onload = function () {
    if (typeof boot === 'function') { try { boot(); } catch (e) {} }
    setTimeout(function () {
      var q = 'n/a';
      try { q = localStorage.getItem('seohan-home-v3:home-test-v5b:walletq') || 'EMPTY'; } catch (e) { q = 'ERR'; }
      document.getElementById('out').textContent =
        'RESULT hits=' + hits + ' | queue=' + (q === 'EMPTY' ? 'EMPTY' : q) + ' | last=' + (bodies[bodies.length - 1] || '-');
    }, 5000);
  };
  /* DOM 은 index.html 본문을 그대로 주입해서 만든다 (앱은 id 로만 찾는다) */
  orig('index.html?qcheck=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var wrap = document.createElement('div');
      wrap.id = 'appwrap';
      wrap.innerHTML = doc.body.innerHTML.replace(/<script[\s\S]*?<\/script>/gi, '');
      document.body.insertBefore(wrap, document.getElementById('out'));
      document.body.appendChild(src);
    });
})();
</script>
</body>
</html>
